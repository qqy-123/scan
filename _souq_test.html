<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>安全验证 | Security Verification</title>
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#1890ff', // 保持和 Antd 类似的蓝色
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

<!-- 卡片容器 -->
<div class="bg-white rounded-lg shadow-sm p-8 md:p-12 w-full max-w-[420px] text-center border border-gray-100">

  <!-- 加载动画 -->
  <div class="inline-block w-10 h-10 border-4 border-gray-100 border-t-primary rounded-full animate-spin mb-8"></div>

  <!-- 标题 -->
  <h2 class="text-lg md:text-xl font-medium text-gray-900 mb-3 tracking-wide">
    正在进行安全检测
  </h2>

  <!-- 描述文本 -->
  <div class="space-y-1.5 mb-8">
    <p class="text-gray-500 text-sm leading-relaxed">
      系统正在验证您的访问环境，请保持网络通畅
    </p>
    <p class="text-gray-400 text-xs">
      页面即将自动跳转，请稍候...
    </p>
  </div>

  <!-- 分割线 -->
  <div class="h-px bg-gray-100 w-full mb-6"></div>

  <!-- 底部安全提示 -->
  <div class="flex items-center justify-center gap-2 text-green-600">
    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
      <path
        d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
    </svg>
    <span class="text-xs font-medium tracking-wide">SSL 安全连接已建立</span>
  </div>
</div>

<script>
  function isMobileDevice() {
    const userAgent = navigator.userAgent.toLowerCase();
    const mobileKeywords = ['android', 'webos', 'iphone', 'ipad', 'ipod', 'blackberry', 'windows phone'];

    for (let i = 0; i < mobileKeywords.length; i++) {
      if (userAgent.indexOf(mobileKeywords[i]) !== -1) {
        return true;
      }
    }

    if (window.screen.width <= 768) {
      return true;
    }

    if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
      return true;
    }

    return false;
  }

  var targetUrl = isMobileDevice() ? "/wap" : "/pc";

  setTimeout(function () {
    window.location.replace(targetUrl);
  }, 0);
</script>
</body>
</html>
